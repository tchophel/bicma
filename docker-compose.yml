services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cms}
      POSTGRES_USER: ${POSTGRES_USER:-cms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cms}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cms} -d ${POSTGRES_DB:-cms}"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Optional virus scanner for uploads. Start with: docker compose --profile scan up -d clamav
  # then set CLAMAV_HOST=clamav in .env (and CLAMAV_REQUIRED=1 to refuse uploads while it is down). First start downloads
  # the virus definitions and takes a few minutes.
  clamav:
    image: clamav/clamav:stable
    profiles: ["scan"]
    restart: unless-stopped

  backend:
    build: ./backend
    command: sh -c "python manage.py migrate && python manage.py bootstrap && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
      - ./frontend/package-lock.json:/frontend-lock.json:ro  # so Settings > Security scan can also check the frontend packages
    ports:
      - "8000:8000"
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-insecure-change-me}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      POSTGRES_DB: ${POSTGRES_DB:-cms}
      POSTGRES_USER: ${POSTGRES_USER:-cms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cms}
      POSTGRES_HOST: db
      BICMA_ADMIN_PASSWORD: ${BICMA_ADMIN_PASSWORD:-}
      BICMA_ADMIN_EMAIL: ${BICMA_ADMIN_EMAIL:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      GITHUB_REPO: ${GITHUB_REPO:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      SONARQUBE_URL: ${SONARQUBE_URL:-}
      SONARQUBE_PROJECT: ${SONARQUBE_PROJECT:-}
      SONARQUBE_TOKEN: ${SONARQUBE_TOKEN:-}
      ZAP_URL: ${ZAP_URL:-}
      ZAP_TARGET: ${ZAP_TARGET:-}
      ZAP_API_KEY: ${ZAP_API_KEY:-}
      BCRS_API_URL: ${BCRS_API_URL:-}
      CLAMAV_HOST: ${CLAMAV_HOST:-}
      CLAMAV_REQUIRED: ${CLAMAV_REQUIRED:-0}
      NDI_API_CLIENT_ID: ${NDI_API_CLIENT_ID:-}
      NDI_API_CLIENT_SECRET: ${NDI_API_CLIENT_SECRET:-}
      NDI_NATS_SEED_KEY: ${NDI_NATS_SEED_KEY:-}
      NDI_API_HOST: ${NDI_API_HOST:-}
      NDI_API_AUTH_ENDPOINT: ${NDI_API_AUTH_ENDPOINT:-}
      NDI_NATS_HOST: ${NDI_NATS_HOST:-}
      NDI_NATS_PORT: ${NDI_NATS_PORT:-}
      NDI_FOUNDATIONAL_ID_CRED_DEF_ID: ${NDI_FOUNDATIONAL_ID_CRED_DEF_ID:-}
      BCRS_API_METHOD: ${BCRS_API_METHOD:-GET}
      BCRS_AUTH_HEADER: ${BCRS_AUTH_HEADER:-Authorization}
      BCRS_API_TOKEN: ${BCRS_API_TOKEN:-}
      BCRS_TOKEN_URL: ${BCRS_TOKEN_URL:-}
      BCRS_CLIENT_ID: ${BCRS_CLIENT_ID:-}
      BCRS_CLIENT_SECRET: ${BCRS_CLIENT_SECRET:-}
      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
      EMAIL_HOST: ${EMAIL_HOST:-localhost}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-1}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-noreply@example.org}
    depends_on:
      db:
        condition: service_healthy

  scheduler:
    build: ./backend
    command: sh -c "sleep 15 && python manage.py run_scheduler"
    volumes:
      - ./backend:/app
      - ./frontend/package-lock.json:/frontend-lock.json:ro
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-insecure-change-me}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      POSTGRES_DB: ${POSTGRES_DB:-cms}
      POSTGRES_USER: ${POSTGRES_USER:-cms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cms}
      POSTGRES_HOST: db
      BICMA_ADMIN_PASSWORD: ${BICMA_ADMIN_PASSWORD:-}
      BICMA_ADMIN_EMAIL: ${BICMA_ADMIN_EMAIL:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      GITHUB_REPO: ${GITHUB_REPO:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      SONARQUBE_URL: ${SONARQUBE_URL:-}
      SONARQUBE_PROJECT: ${SONARQUBE_PROJECT:-}
      SONARQUBE_TOKEN: ${SONARQUBE_TOKEN:-}
      ZAP_URL: ${ZAP_URL:-}
      ZAP_TARGET: ${ZAP_TARGET:-}
      ZAP_API_KEY: ${ZAP_API_KEY:-}
      BCRS_API_URL: ${BCRS_API_URL:-}
      BCRS_API_METHOD: ${BCRS_API_METHOD:-GET}
      BCRS_AUTH_HEADER: ${BCRS_AUTH_HEADER:-Authorization}
      BCRS_API_TOKEN: ${BCRS_API_TOKEN:-}
      BCRS_TOKEN_URL: ${BCRS_TOKEN_URL:-}
      BCRS_CLIENT_ID: ${BCRS_CLIENT_ID:-}
      BCRS_CLIENT_SECRET: ${BCRS_CLIENT_SECRET:-}
      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
      EMAIL_HOST: ${EMAIL_HOST:-localhost}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-1}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-noreply@example.org}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    command: npm run dev -- --host 0.0.0.0
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      - backend

volumes:
  pgdata:
