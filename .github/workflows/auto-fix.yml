name: Auto fix

# Started by the Solve button in the CMS (Settings > Security scan) or by hand from the Actions tab.
# It never pushes to the main branch: it opens a pull request that a person reviews and merges.
on:
  workflow_dispatch:
    inputs:
      what:
        description: "What to fix: all, packages or code"
        required: false
        default: all
      sonar_url:
        description: SonarQube / SonarCloud address (leave empty to skip code fixes)
        required: false
        default: ""
      sonar_project:
        description: SonarQube project key
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

jobs:
  fix:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SONAR_URL: ${{ inputs.sonar_url }}
      SONAR_PROJECT: ${{ inputs.sonar_project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update vulnerable frontend packages
        if: ${{ inputs.what != 'code' }}
        working-directory: frontend
        run: npm audit fix || true

      - name: Update vulnerable backend packages
        if: ${{ inputs.what != 'code' }}
        run: |
          pip install pip-audit==2.9.0 -r backend/requirements.txt
          pip-audit -r backend/requirements.txt --fix || true

      - name: Fix SonarQube code issues with Claude
        if: ${{ inputs.what != 'packages' && env.SONAR_TOKEN != '' && env.ANTHROPIC_API_KEY != '' && inputs.sonar_url != '' && inputs.sonar_project != '' }}
        run: |
          curl -sf -u "$SONAR_TOKEN:" "$SONAR_URL/api/issues/search?componentKeys=$SONAR_PROJECT&types=BUG,VULNERABILITY&resolved=false&ps=200" > issues.json
          npx -y @anthropic-ai/claude-code@2.1.330 -p "issues.json lists open SonarQube bugs and vulnerabilities (the component field is project:path). Fix each one in the code with the smallest safe change. Do not change behaviour. Skip any issue you are not sure about. Do not touch issues.json." --permission-mode acceptEdits --allowedTools "Read,Edit,Glob,Grep"
          rm -f issues.json

      - name: Check the fixed code still builds
        id: build
        continue-on-error: true
        run: |
          cd frontend && npm ci && npm run build

      - uses: peter-evans/create-pull-request@v7
        with:
          branch: auto-fix/security
          title: "Security auto-fix"
          commit-message: "Security auto-fix: package updates and code issues"
          body: |
            Made by the Solve button in Settings > Security scan.

            Frontend build after the fixes: **${{ steps.build.outcome }}**

            Review the changes, run the tests, then merge. Packages were updated with `npm audit fix` and `pip-audit --fix`;
            code issues were fixed with Claude only when the SONAR_TOKEN and ANTHROPIC_API_KEY secrets are set.
