# BICMA CMS in namespace bcs. Secrets are NOT in this file: see k8s/README.md.
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: cms-db-data, namespace: bcs }
spec: { accessModes: [ReadWriteMany], storageClassName: openebs-rwx, resources: { requests: { storage: 5Gi } } }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: cms-media, namespace: bcs }
spec: { accessModes: [ReadWriteMany], storageClassName: openebs-rwx, resources: { requests: { storage: 10Gi } } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: cms-db, namespace: bcs }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: cms-db } }
  template:
    metadata: { labels: { app: cms-db } }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - { name: POSTGRES_DB, value: cms }
            - { name: POSTGRES_USER, value: cms }
            - { name: POSTGRES_PASSWORD, valueFrom: { secretKeyRef: { name: cms-secrets, key: POSTGRES_PASSWORD } } }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          ports: [{ containerPort: 5432 }]
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
          readinessProbe: { exec: { command: [pg_isready, -U, cms, -d, cms] }, periodSeconds: 5 }
      volumes: [{ name: data, persistentVolumeClaim: { claimName: cms-db-data } }]
---
apiVersion: v1
kind: Service
metadata: { name: cms-db, namespace: bcs }
spec: { selector: { app: cms-db }, ports: [{ port: 5432 }] }
---
apiVersion: v1
kind: ConfigMap
metadata: { name: cms-config, namespace: bcs }
data:
  DJANGO_DEBUG: "0"
  DJANGO_ALLOWED_HOSTS: "bicma-cms.systems.gov.bt,cms-backend"
  CORS_ALLOWED_ORIGINS: "https://bicma-cms.systems.gov.bt"
  FRONTEND_URL: "https://bicma-cms.systems.gov.bt"
  POSTGRES_HOST: cms-db
  POSTGRES_DB: cms
  POSTGRES_USER: cms
  EMAIL_BACKEND: django.core.mail.backends.smtp.EmailBackend
  EMAIL_HOST: smtp.gmail.com
  EMAIL_PORT: "587"
  EMAIL_USE_TLS: "1"
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: cms-backend, namespace: bcs }
spec:
  replicas: 1
  selector: { matchLabels: { app: cms-backend } }
  template:
    metadata: { labels: { app: cms-backend } }
    spec:
      imagePullSecrets: [{ name: harbor-secret }]
      securityContext: { fsGroup: 10001 }
      initContainers:
        - name: migrate
          image: dev-harbor.systems.gov.bt/bcs/cms-backend:v1
          command: [sh, -c, "python manage.py migrate --noinput && python manage.py bootstrap"]
          envFrom: [{ configMapRef: { name: cms-config } }, { secretRef: { name: cms-secrets } }]
      containers:
        - name: backend
          image: dev-harbor.systems.gov.bt/bcs/cms-backend:v1
          envFrom: [{ configMapRef: { name: cms-config } }, { secretRef: { name: cms-secrets } }]
          env: [{ name: HOME, value: /tmp }]
          ports: [{ containerPort: 8000 }]
          volumeMounts: [{ name: media, mountPath: /app/media }]
          readinessProbe: { tcpSocket: { port: 8000 }, periodSeconds: 5 }
      volumes: [{ name: media, persistentVolumeClaim: { claimName: cms-media } }]
---
apiVersion: v1
kind: Service
metadata: { name: cms-backend, namespace: bcs }
spec: { selector: { app: cms-backend }, ports: [{ port: 8000 }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: cms-frontend, namespace: bcs }
spec:
  replicas: 1
  selector: { matchLabels: { app: cms-frontend } }
  template:
    metadata: { labels: { app: cms-frontend } }
    spec:
      imagePullSecrets: [{ name: harbor-secret }]
      containers:
        - name: web
          image: dev-harbor.systems.gov.bt/bcs/cms-frontend:v1
          ports: [{ containerPort: 8080 }]
---
apiVersion: v1
kind: Service
metadata: { name: cms-frontend, namespace: bcs }
spec: { selector: { app: cms-frontend }, ports: [{ port: 80, targetPort: 8080 }] }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cms
  namespace: bcs
  annotations: { nginx.ingress.kubernetes.io/proxy-body-size: 40m }
spec:
  ingressClassName: nginx
  tls: [{ hosts: [bicma-cms.systems.gov.bt], secretName: systems-tls }]
  rules:
    - host: bicma-cms.systems.gov.bt
      http: { paths: [{ path: /, pathType: Prefix, backend: { service: { name: cms-frontend, port: { number: 80 } } } }] }
